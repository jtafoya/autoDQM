- run: 1702
  category: vmax_distribution_shift
  cause: 'The Vmax pulse distribution increased after changes made during preceding
    slab detector tests. The eLog suggests that this may have been related to a software
    or zero-suppression change removing normal-sized pulses, but the cause was not
    confirmed.

    '
  action: 'Revert to running without zero suppression.

    '
  recovery: 'After reverting to no zero suppression, the average Vmax returned to
    its previous levels by run 1705.

