- run: 1747
  category: high_trigger_rate
  cause: 'The slab detector entered a high-rate state following a power trip. The
    trigger logic was not behaving as expected. During troubleshooting, it was found
    that MilliDAQ had not been recompiled after the firmware was reflashed, and a
    faulty LVDS cable was also identified.

    '
  action: 'Recompile MilliDAQ after reflashing the firmware and fix the faulty LVDS
    cable.

    '
  recovery: 'Slab detector rates returned to normal and trigger logic behaved as expected.

    '
- run: 2068
  category: LVDS_noise
  cause: Unclear. Possible charge collection in LVDS pins, or mechanical failure of
    the LVDS jumper wires needing readjustment; higher trigger rates than usual
  action: 'Physical intervention: Carefully check whether all the LVDS pins are fully
    seated into the trigger board and digitizer Physical intervention: Carefully press
    in all the jumper wires while the run is off, and check again by starting a new
    run. It may take a few iterations. Check physical channel mapping and cable connections
    for the flagged channels.

    '
  recovery: Trigger rates recover to nominal values
- run: 2126
  category: LVDS_noise
  cause: 'DAQ board-matching efficiency dropped below 100% beginning in run 2126,
    file 26, around event 700. The DAQ queue filled with mostly empty, unmatched digitizer
    events and the apparent digitizer trigger rate became abnormally high while the
    trigger-board files remained normal. Trigger-mask tests localized the problem
    to digitizer 0 LVDS channel 0, corresponding to detector channels 0 and 1. The
    subsequent intervention indicated an intermittent or degraded LVDS-pin, jumper-wire,
    or MCX signal connection.

    '
  action: 'Temporarily mask LVDS channel 0 or the affected trigger path to permit
    data taking. Isolate the problematic connection by removing trigger-mask channels
    one at a time and restoring them until the problem reappears. Inspect and reseat
    the LVDS pins at both the trigger board and digitizer, the LVDS jumper wires,
    and the MCX signal cables for digitizer channels 0 and 1. Start a new run after
    each connection change and monitor board matching, DAQ queue occupancy, and trigger
    rates.

    '
  recovery: 'Board-matching efficiency returns to 100%, the DAQ queue no longer fills
    with empty unmatched events, trigger rates return to their normal range, and all
    affected cables and channels can remain connected and enabled without the problem
    recurring.

    '
