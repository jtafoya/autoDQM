- run: 1620
  category: daq_auto_restart
  cause: unknown
  action: If a DAQ restart or transient DAQ state change is confirmed near the anomalous subruns, review
    the restart and run-control logs, verify configuration continuity, and restart or reinitialize the
    affected DAQ components before retaking data. If no restart is found, inspect LVDS/trigger matching
    and channel-level pulse-count behavior to distinguish a readout issue from detector hardware.
- run: 1640
  category: broken_PMT_base
  cause: Unknown. The strongest hypothesis is a hardware/readout fault affecting the channel-32/33 region,
    possibly a broken PMT base or associated connection. This is an analogy rather than an exact historical
    match.
  action: Conditionally, inspect and reseat the PMT base, cabling, channel mapping, and readout connections
    for channels 32 and 33; check the anomaly onset by subrun and compare the affected channels with neighboring
    channels before replacing hardware. Also verify DAQ configuration because nearly every subrun is affected.
- run: 1642
  category: LVDS_noise
  cause: unknown; the repeated missing-channel flags for channels 32 and 33, together with persistent
    pulse-count and pulse-feature anomalies, are consistent with a possible intermittent LVDS, trigger-path,
    or related channel connection problem. A broader DAQ/data-path fault remains possible.
  action: 'Conditional on confirming a connection or trigger-path fault: stop data taking, inspect and
    reseat the LVDS pins, jumper wires, MCX cables, and channel mapping for channels 32 and 33, then run
    trigger-mask/isolation tests while monitoring missing-channel counts, board matching, queue occupancy,
    and trigger rates. If those checks are normal, investigate DAQ restart or configuration/software state
    instead.'
- run: 1702
  category: systemic_DAQ_or_digitizer_data_integrity_failure
  cause: unknown; the anomaly is persistent across all 129 subruns and affects a very large fraction of
    channel-entries, with extreme capped statistical scores concentrated in pulse-count, pulse-height,
    and pulse-area features. This is more consistent with a run-wide acquisition or data-integrity problem
    than an isolated detector channel fault, but the supplied evidence does not establish whether the
    mechanism was a DAQ restart/state fault, digitizer lockup, high CPU condition, or LVDS/trigger-path
    issue.
  action: Inspect DAQ and digitizer logs for restarts, lockups, CPU or queue alarms, board-matching efficiency,
    trigger rates, and missing-channel status around the run. Verify digitizer and LVDS/trigger connections
    and compare raw pulse distributions with a known-good run. If a DAQ or digitizer state fault is confirmed,
    perform the corresponding controlled process/PC restart; if an LVDS or trigger-path fault is localized,
    reseat or temporarily mask the affected path before retaking data.
- run: 1703
  category: daq_systemic_or_data_integrity_anomaly
  cause: unknown
  action: Conditionally, if raw-data and operational checks confirm a DAQ or configuration fault, inspect
    DAQ restart/error logs, trigger and digitizer rates, board-matching efficiency, queue occupancy, channel
    completeness, firmware/configuration consistency, and representative raw waveforms; then reinitialize
    or restart the affected DAQ component and validate a new run.
- run: 2126
  category: DAQ-wide acquisition interruption or restart
  cause: Unknown; the broad missing-channel pattern and repeated extreme nPulses_median anomalies suggest
    a DAQ/data-stream or configuration problem more than an isolated detector channel fault.
  action: Check DAQ and digitizer logs for an automatic restart, lockup, firmware/configuration change,
    or acquisition interruption near the affected subruns; compare channel presence and pulse counts before
    and after the onset. If a DAQ lockup or restart is confirmed, restart the affected DAQ component using
    the approved procedure and verify channel recovery.
