- run: 1620
  category: suspected_daq_auto_restart
  cause: unknown
  action: Check DAQ, run-control, trigger-rate, and CPU logs at the 35 anomalous subruns for a restart
    or transient acquisition interruption. If a restart is confirmed, verify that configuration and trigger
    rates returned to nominal; perform a controlled MilliDAQ restart only if acquisition remains abnormal.
    If anomalies instead remain localized to particular channels, inspect their readout and pulse-count
    paths before intervening.
- run: 1640
  category: localized_channel_32_33_readout_failure
  cause: unknown; possible channel-pair front-end, digitizer, cabling, or PMT-base fault
  action: If the channel-32/33 dropout is confirmed in raw data, stop the run and inspect/reseat the corresponding
    signal, power, and readout connections; verify channel mapping and digitizer status, then start a
    short test run. If channel 32 remains present but its pulse and occupancy distributions remain abnormal,
    separately test its PMT base and front-end electronics.
- run: 1642
  category: persistent_channel_dropout
  cause: unknown
  action: First verify in raw data and channel-presence logs whether channels 32 and 33 are absent throughout
    the run rather than merely suppressed by configuration. Check channel masks, mapping, zero-suppression
    settings, and the shared digitizer/readout path for channels 32–33. If the dropout is hardware-localized,
    stop the run and inspect/reseat the associated signal and LVDS connections; if readout is stalled,
    restart the affected DAQ component and validate with a short test run.
- run: 1702
  category: suspected_trigger_path_or_readout_synchronization_fault
  cause: unknown
  action: First verify trigger-board versus digitizer rates, board-matching efficiency, DAQ queue occupancy,
    event completeness, and the subrun-by-subrun onset. If unmatched or empty digitizer events or abnormal
    rates confirm a trigger/LVDS synchronization fault, use trigger masks to localize the path, then inspect
    and reseat the implicated LVDS pins, jumper wires, and signal cables while the run is off. If synchronization
    is normal, check run configuration and AutoDQM reference/scaling before replacing hardware.
- run: 1703
  category: suspected_detector_wide_high_occupancy_or_configuration_shift
  cause: unknown
  action: If a detector-wide high-occupancy or configuration shift is confirmed, compare the run configuration
    and anomaly reference with a known-good run, inspect raw waveforms and per-channel pulse counts, and
    check trigger rates, trigger masks, board matching, DAQ queue status, and recent firmware or cabling
    changes. If rates or matching are abnormal, isolate trigger paths or LVDS connections before restarting;
    if acquisition is normal, rebuild or select the correct AutoDQM reference.
- run: 2126
  category: intermittent_multi-channel_readout_loss
  cause: unknown; the pattern is consistent with intermittent DAQ/digitizer data loss or a global acquisition/trigger
    disruption, but the snapshot cannot distinguish these possibilities
  action: First verify raw per-subrun channel presence, event counts, and trigger rate, and map missing
    channels to digitizer/DAQ hardware boundaries. Check DAQ logs for readout errors, synchronization
    loss, or restarts. If losses cluster on a digitizer, conditionally restart and inspect that digitizer,
    its DAQ process, and connections; if losses are detector-wide and coincide with a trigger-rate collapse,
    inspect the trigger and LVDS path instead.
