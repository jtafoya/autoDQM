# autoDQM isolation-forest pipeline — central configuration.
# Applies the model trained on good data to the all-data run list to assess detection rate over all kinds of runs
# All paths are absolute so the file works from Condor worker nodes, cron jobs, or any working directory. CLI arguments always override these values.

# --- Input ---
# Run lists: text files where each line is a glob pattern resolving to Digitizer CSV files.
# data_path is the base directory; the individual lists are absolute paths derived from it.
data_path:        /afs/cern.ch/user/l/lbailloe/private/autoDQM/data/
#good_list:        /afs/cern.ch/user/t/tafoyava/autoDQM/data/good_run_list_EOS.txt
good_list:        /afs/cern.ch/user/l/lbailloe/private/autoDQM/data/good_run_list_TRAINING.txt
#apply_list:       /afs/cern.ch/user/t/tafoyava/autoDQM/data/all_run_list_EOS.txt
apply_list:       /afs/cern.ch/user/l/lbailloe/private/autoDQM/data/all_run_list_EXTENDED.txt
goodRunsList_json: /afs/cern.ch/user/l/lbailloe/private/autoDQM/data/goodRunsListSlab.json
#goodRunsList_json: /afs/cern.ch/user/t/tafoyava/autoDQM/data/goodRunsListSlab_extended.json

# --- Output ---
# model_tag namespaces all outputs: models/<tag>/, logs/<tag>.csv, reports/<tag>/, plots/<tag>/.
model_tag:   default
models_dir:  /afs/cern.ch/user/l/lbailloe/private/autoDQM/isolation_forest/models
logs_dir:    /afs/cern.ch/user/l/lbailloe/private/autoDQM/isolation_forest/logs
reports_dir: /afs/cern.ch/user/l/lbailloe/private/autoDQM/isolation_forest/reports
plots_dir:   /afs/cern.ch/user/l/lbailloe/private/autoDQM/isolation_forest/plots

# --- Features ---
# use_trigger includes TriggerBoard rate features; use_lvds includes LVDS pin-count features.
# ignore_features: list of glob patterns for features to exclude entirely from training and
# scoring (e.g. TDCRollovers_* drops TDCRollovers_mean/std/median).
use_trigger: true
use_lvds:    true
ignore_features:
  - "TDC*"
#  - "TDCRollovers_*"
# ignore_features: []

# --- Run configuration features (optional) ---
# Paths to the per-run MilliDAQ configuration files.
# run_configs_dir: directory containing Run{N}TriggerDefault.py and Run{N}DAQDefault.py.
# thresholds_json_path: path to thresholds.json used for per-channel DAQ thresholds.
run_configs_dir:       /eos/experiment/milliqan/run3/slab/configs
thresholds_json_path:  /eos/experiment/milliqan/run3/slab/configs/thresholds.json

# Trigger board config (Run{N}TriggerDefault.py).
# Set includeConfigInfo_Trigger: false to exclude entirely; the model tag will
# gain the suffix _ignoreTriggerConfig.
# Supported variables: triggerBoard.trigger, triggerBoard.prescale,
#   triggerBoard.trigger_mask, triggerBoard.dead_time, triggerBoard.coincidence_time,
#   triggerBoard.nLayerThreshold, triggerBoard.nHitThreshold, triggerBoard.zero_bias
includeConfigInfo_Trigger: true
includeConfigVariables_Trigger:
  - "triggerBoard.trigger"
  - "triggerBoard.prescale"
  - "triggerBoard.trigger_mask"

# DAQ config (Run{N}DAQDefault.py + thresholds.json).
# Set includeConfigInfo_DAQ: false to exclude entirely; the model tag will
# gain the suffix _ignoreDAQConfig.
# Supported variables: channel.triggerThreshold
includeConfigInfo_DAQ: true
includeConfigVariables_DAQ:
  - "channel.triggerThreshold"

# --- Detection thresholds ---
# z_threshold: |z-score| above which a feature is flagged.
# if_contamination: expected anomaly fraction for IsolationForest.
# if_n_estimators:  number of trees in the Isolation Forest ensemble.
# if_max_samples:   samples drawn per tree (sklearn max_samples); higher = lower score variance.
# if_max_features:  fraction of features considered per split (sklearn max_features); 1.0 = all.
z_threshold:      7.0
if_contamination: 0.001
if_n_estimators:  200
if_max_samples:   auto
if_max_features:  1.0

# Persistence-based alert (sustained degradation):
#   file_alert_n_channels — minimum number of *persistent* anomalous channels for [ALERT].
#     Can be low (e.g. 2) because persistence already suppresses transient noise.
#   alert_consecutive_n — how many consecutive files a channel must be anomalous in to count
#     as persistent (1 = disabled).
file_alert_n_channels: 2
alert_consecutive_n:   3

# Single-file severity alerts (no persistence required, fire on one bad file):
#   single_file_alert_n_channels — [ALERT] when this many channels are anomalous at once.
#     Targets sudden widespread events (power glitch, noisy run). Set higher than
#     file_alert_n_channels (e.g. 5) since there is no persistence filter. 0 = disabled.
#   single_file_alert_max_z — [ALERT] when any channel's max_z reaches this value.
#     Targets a single catastrophically out-of-range channel (e.g. broken hardware).
#     0.0 = disabled.
single_file_alert_n_channels: 5
single_file_alert_max_z:      15.0

# --- Misc ---
# poll_interval:    seconds between directory scans in watch mode.
# test_seed:        random seed for reproducible test-mode file sampling.
# max_subrun_plots: per category, produce up to this many subrun plot sets —
#   max_subrun_plots random bad subruns (always including the worst) and
#   max_subrun_plots random good subruns (below file_alert_n_channels).
#   -1 = no limit (plots every file — can be very slow and disk-heavy; a loud warning is printed).
poll_interval:    5.0
test_seed:        42
max_subrun_plots: 5

# --- Full-sample training run range (--train-goodRunList mode) ---
# Restrict training to runs whose number falls in [min, max] (both inclusive).
# Omit, comment out or set to null (default) for no bound on that side.
# train_goodRunList_min_run: null
train_goodRunList_min_run: 1422
# train_goodRunList_max_run: null
