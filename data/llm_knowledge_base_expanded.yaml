# Source: Inferred mapping to MilliQanRun3 Message 339 (2025-12-18), Dariush Imani; run number inferred from chronology + AutoDQM.
- run: 1747
  category: high_trigger_rate
  cause: >
    The slab detector entered a high-rate state following a power trip.
    The trigger logic was not behaving as expected. During troubleshooting,
    it was found that MilliDAQ had not been recompiled after the firmware
    was reflashed, and a faulty LVDS cable was also identified.
  action: >
    Recompile MilliDAQ after reflashing the firmware and fix the faulty LVDS cable.
  recovery: >
    Slab detector rates returned to normal and trigger logic behaved as expected.

