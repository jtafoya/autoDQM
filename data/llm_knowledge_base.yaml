- run: 2068
  category: LVDS_noise
  cause: Unclear. Possible charge collection in LVDS pins, or mechanical failure of the LVDS jumper wires needing readjustment; higher trigger rates than usual
  action: >
    Physical intervention: Carefully check whether all the LVDS pins are fully seated into the trigger board and digitizer
    Physical intervention: Carefully press in all the jumper wires while the run is off, and check again by starting a new run. It may take a few iterations.
    Check physical channel mapping and cable connections for the flagged channels.
  recovery: Trigger rates recover to nominal values

