# From Branch 

# Source: MilliQanRun3 ELOG 343 (2026-04-10) and 344 (2026-04-17).
- run: 2126
  category: LVDS_noise
  cause: >-
    DAQ board-matching efficiency dropped below 100% beginning in run 2126,
    file 26, around event 700. The DAQ queue filled with mostly empty,
    unmatched digitizer events and the apparent digitizer trigger rate became
    abnormally high while the trigger-board files remained normal.
    Trigger-mask tests localized the problem to digitizer 0 LVDS channel 0,
    corresponding to detector channels 0 and 1. The subsequent intervention
    indicated an intermittent or degraded LVDS-pin, jumper-wire, or MCX signal
    connection.
  action: >-
    Temporarily mask LVDS channel 0 or the affected trigger path to permit data
    taking. Isolate the problematic connection by removing trigger-mask
    channels one at a time and restoring them until the problem reappears.
    Inspect and reseat the LVDS pins at both the trigger board and digitizer,
    the LVDS jumper wires, and the MCX signal cables for digitizer channels 0
    and 1. Start a new run after each connection change and monitor board
    matching, DAQ queue occupancy, and trigger rates.
  recovery: >-
    Board-matching efficiency returns to 100%, the DAQ queue no longer fills
    with empty unmatched events, trigger rates return to their normal range,
    and all affected cables and channels can remain connected and enabled
    without the problem recurring.

