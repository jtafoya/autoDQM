# Human-maintained list of known bad runs with cause and fix.
#
# Each entry references a run that has been processed by the pipeline (so its
# anomaly data exists in the anomaly log).  Write only the human knowledge here:
# category, cause, action, recovery.  Anomaly snapshots (z-scores, channels,
# triggered features) are injected automatically from the log at call time.
#
# Add a new entry every time a bad run is understood and resolved.
# The more specific the cause/action/recovery, the better the LLM match quality.
#
# Fields
# ------
# run      : integer run number (must exist in the anomaly log for auto-injection)
# category : short snake_case label, e.g. hv_instability, dead_channels,
#            trigger_misconfiguration, noisy_run, unknown
# cause    : one or two sentences describing what went wrong
# action   : specific actionable step to investigate or resolve
# recovery : observable indicator that the issue is resolved

# ── Add entries below ─────────────────────────────────────────────────────────

# Example (replace with real documented runs):

- run: 1640
  category: broken_PMT_base
  cause: Damaged PMT base due to unknown reasons, possibly power grid fluctuations propagating through the LV supplies; appeared first as change of channel ch32/33 behaviour (both are coupled through the same LVDS pin) leading e.g. to smaller VMax readouts; eventually the channel HV tripped and completely turned off contributions from these channels/LVDS
  action: >
    Check the HV current draw
    Check HV log for a trip near the run timestamp.
    If channel current draws are unstable or different from nominal, switch it off until a physical intervention can be carried out.
    Physical intervention: Check continuity of all HV cables between HVPS and involved channels.
    Physical intervention: Disconnect the HV off all the relevant PMT bases. Connect one at a time and turn HV on noting which ones don't draw nominal current values. This allows to indentify the faulty HV paths (problem can be either in the cables, at the connectors, or at the base.
    Physical intervention: Use a validated healthy HV cable to power the problematic base. If draws are nominal, then the culprit is most likely in the HV cable and/or connector between the HV splitter box and the base. If the current draw is not nominal, then try replacing the base for a new one. N.B. be sure to use the same base version and set exactly the same gain with the switches to match the broken base!
    Physical intervention: If the problem is in the cables/connectors, do further eliminatory testing to determine isolate the issue. E.g. plug a healthy cable into the output of the HV splitter originally leading to the issue, and use it to power a healtyh PMT. If draws are nominal, the issue is at the original cable not currently being used.
  recovery: HV draw back to nominal and stable values, LVDS counts non-zero, VMax recovers for the involved channels

